name: Update VLESS Configs

on:
  schedule:
    - cron: '0 * * * *' # Запуск каждый час
  workflow_dispatch: # Кнопка для ручного запуска

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # Даем скрипту до 30 минут на проверку всех серверов

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install "requests[socks]" PyGithub

      - name: Install system utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip

      - name: Run script
        env:
          MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: python main.py
